{% extends "web/settings/settings_base.html" %}
{% load i18n %}
{% load form_tags %}
{% block settings_content %}
  <form method="post" class="app-card space-y-4" data-testid="book-create-form">
    {% csrf_token %}
    {% render_text_input form.name %}

    <fieldset>
      <legend class="mb-2 font-bold">{{ form.start.label }}</legend>
      <div class="grid gap-2">
        {% for choice in form.start %}
          <label class="flex cursor-pointer items-start gap-3 rounded-field border border-base-300 p-3 hover:bg-base-200 has-[:checked]:border-primary has-[:checked]:bg-primary/5"
                 data-testid="book-start-{{ choice.data.value }}">
            <input type="radio" name="{{ form.start.html_name }}" value="{{ choice.data.value }}"
                   class="radio radio-primary radio-sm mt-0.5 shrink-0"
                   {% if choice.data.selected %}checked{% endif %}>
            <span>{{ choice.choice_label }}</span>
          </label>
        {% endfor %}
      </div>
      {{ form.start.errors }}
    </fieldset>

    <div class="flex gap-2">
      <button type="submit" class="btn btn-primary" data-testid="book-create-submit">{% translate "Create" %}</button>
      <a href="{% url 'books_team:list' request.team.slug %}" class="btn btn-ghost">{% translate "Cancel" %}</a>
    </div>
  </form>
{% endblock %}
