{% extends "web/app/app_base.html" %}
{% load i18n %}
{% block app %}
<section class="app-card">
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-xl mb-1">{{ payee.name }}</h3>
    <div class="flex gap-2">
      <a href="{% url 'accounts:payee_update' request.team.slug request.book.slug payee.pk %}" class="btn btn-primary">
        {% translate "Edit" %}
      </a>
      <a href="{% url 'accounts:payee_delete' request.team.slug request.book.slug payee.pk %}" class="btn btn-outline btn-error">
        {% translate "Delete" %}
      </a>
    </div>
  </div>
  <dl class="grid grid-cols-1 gap-4">
    <div>
      <dt class="font-semibold">{% translate "Name" %}</dt>
      <dd>{{ payee.name }}</dd>
    </div>
    <div>
      <dt class="font-semibold">{% translate "Created" %}</dt>
      <dd>{{ payee.created_at }}</dd>
    </div>
  </dl>
</section>
{% endblock %}
