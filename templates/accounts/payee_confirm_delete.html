{% extends "web/app/app_base.html" %}
{% load i18n %}
{% block app %}
<section class="app-card">
  <h3 class="pg-subtitle">{% translate "Delete Payee" %}</h3>
  <form method="post">{% csrf_token %}
    <p class="mb-4">{% blocktranslate with name=payee.name %}Are you sure you want to delete "{{ name }}"?{% endblocktranslate %}</p>
    <div class="flex gap-2">
      <input type="submit" class="pg-button-danger" value="{% translate 'Delete' %}">
      <a href="{{ payee.get_absolute_url }}" class="pg-button-secondary">{% translate "Cancel" %}</a>
    </div>
  </form>
</section>
{% endblock %}
