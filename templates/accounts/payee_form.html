{% extends "web/app/app_base.html" %}
{% load i18n %}
{% load form_tags %}
{% block app %}
<section class="app-card">
  <h3 class="text-xl mb-1">{% if payee %}{% translate "Edit" %} {{ payee.name }}{% else %}{% translate "New Payee" %}{% endif %}</h3>
  <form method="post">{% csrf_token %}
      {% render_form_fields form %}
      <div class="flex gap-2">
        <input type="submit" class="btn btn-primary" value="{% translate 'Save' %}">
        <a href="{% url 'accounts:payee_list' request.team.slug request.book.slug %}" class="btn btn-outline">{% translate "Cancel" %}</a>
      </div>
  </form>
</section>
{% endblock %}
