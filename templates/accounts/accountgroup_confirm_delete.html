{% extends "web/app/app_base.html" %}
{% load i18n %}
{% block app %}
<section class="app-card">
  <h3 class="text-xl mb-1">{% translate "Delete Account Group" %}</h3>
  <form method="post">{% csrf_token %}
    <p class="mb-4">{% blocktranslate with name=accountgroup.name %}Are you sure you want to delete "{{ name }}"?{% endblocktranslate %}</p>
    <div class="flex gap-2">
      <input type="submit" class="btn btn-outline btn-error" value="{% translate 'Delete' %}">
      <a href="{{ accountgroup.get_absolute_url }}" class="btn btn-outline">{% translate "Cancel" %}</a>
    </div>
  </form>
</section>
{% endblock %}
