{% extends "web/app/app_base.html" %}
{% load static %}
{% load form_tags %}
{% block app %}
<nav class="breadcrumbs text-sm" aria-label="breadcrumbs">
  <ul>
    <li><a href="{% url 'teams_example:player_list' request.team.slug %}">Players</a></li>
    <li><a href="{{ player.get_absolute_url }}">{{ player.name }}</a></li>
    <li class="text-base-content/70" aria-current="page">Delete</li>
  </ul>
</nav>
<section class="app-card">
  <h3 class="text-xl mb-1">Confirm Delete</h3>
  <form method="post">{% csrf_token %}
    <p>
      Are you sure you want to delete <strong>{{ player }}</strong>?
      This action cannot be undone.
    </p>
    <div class="mt-2">
      <input type="submit" class="btn btn-outline btn-error" value="Delete">
    </div>
  </form>
</section>
{% endblock %}
